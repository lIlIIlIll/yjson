name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      cangjie_version:
        description: Pinned Cangjie STS version for release qualification (currently 1.2.0)
        required: false
        type: string

permissions:
  contents: read

jobs:
  ci-guardrails:
    name: CI guardrail regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          submodules: recursive
      - name: Install probe compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Test CI and performance policy wiring
        env:
          YJSON_REQUIRE_UBSAN_PROBE: '1'
        run: |
          python3 scripts/test_ci_candidate_wiring.py
          python3 scripts/test_json_pure_perf_compare.py
          python3 scripts/test_benchmark_pure_direct.py
          python3 scripts/test_release_consumer_checks.py

  generated-change-risk:
    name: Generated code change risk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 0
          submodules: recursive
      - name: Require external runtime tests for macro and SPI changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          if [[ -z "$base" ]]; then base="$PUSH_BASE_SHA"; fi
          if [[ -n "$base" && "$base" != "0000000000000000000000000000000000000000" ]]; then
            python3 scripts/check_generated_change_risk.py --base "$base"
          else
            python3 scripts/check_generated_change_risk.py
          fi

  perf-evidence-drift:
    name: Seven-library evidence drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 0
          submodules: recursive
      - name: Verify current seven-library evidence
        env:
          # Development may contain unmeasured performance-input changes. The
          # main contract remains strict for PRs, pushes, scheduled runs, and
          # manual dispatches.
          YJSON_EVIDENCE_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'integrity-only' || 'strict' }}
        run: scripts/ci_job.sh perf-evidence-drift "$YJSON_EVIDENCE_MODE"

  stream-docs:
    name: Stream evidence drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          submodules: recursive
      - name: Verify frozen Stream evidence and generated documentation
        run: scripts/ci_job.sh stream-docs

  sts:
    name: Cangjie STS (pinned)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
      resolution: ${{ steps.version.outputs.resolution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          submodules: recursive
      - name: Test STS and candidate wiring
        run: |
          python3 scripts/test_validate_cangjie_sts.py
      - name: Export shared STS version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.cangjie_version }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            value=$(python3 scripts/validate_cangjie_sts.py \
              --validate-version "$REQUESTED_VERSION")
            resolution=workflow-dispatch-exact
          else
            value=$(python3 scripts/validate_cangjie_sts.py --print-pinned-version)
            python3 scripts/validate_cangjie_sts.py \
              --validate-version "$value" >/dev/null
            resolution=pinned-sts
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "resolution=$resolution" >> "$GITHUB_OUTPUT"
          echo "resolved_cangjie_version=$value resolution=$resolution"
          {
            echo '### Cangjie STS selection'
            echo
            echo "- Version: \`$value\`"
            echo "- Resolution: \`$resolution\`"
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests (${{ matrix.gate }})
    needs: sts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        optimization: ['-O2']
        gate:
          - api-inventory
          - cjdoc-qualification
          - runtime-freeze
          - core
          - standards-conformance
          - schema-formats-conformance
          - examples
          - macro-consumer
          - algorithms-consumer
          - registry-rehearsal
          - custom-native
          - yyjson-native
          - native-clang
          - native-gcc
          - sanitizer
          - fuzz-short
          - yyjson-colink
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          submodules: recursive
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571
        with:
          channel: sts
          version: ${{ needs.sts.outputs.version }}
          cjv-version: v0.5.0
          components: stdx
      - name: Install native prerequisites
        if: contains(fromJSON('["standards-conformance","schema-formats-conformance","algorithms-consumer","registry-rehearsal","custom-native","yyjson-native","native-clang","native-gcc","sanitizer","fuzz-short","yyjson-colink"]'), matrix.gate)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc libidn2-dev
          dpkg-query -W -f='${Package}=${Version}\n' clang gcc libidn2-dev
      - name: Restore pinned standards suites cache
        if: contains(fromJSON('["standards-conformance","schema-formats-conformance"]'), matrix.gate)
        id: standards-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/yjson-standards-suites
          # The key fingerprints the pinned suite revisions embedded in the
          # runner, so any suite revision change rotates the cache.
          key: yjson-standards-suites-${{ hashFiles('scripts/run_standards_conformance.py') }}
      - name: Prefetch pinned standards suites with SHA-256 verification
        if: contains(fromJSON('["standards-conformance","schema-formats-conformance"]'), matrix.gate) && steps.standards-cache.outputs.cache-hit != 'true'
        run: python3 scripts/run_standards_conformance.py --prefetch --cache /tmp/yjson-standards-suites
      - name: Fetch pinned yyjson co-link fixture
        if: matrix.gate == 'yyjson-colink'
        run: |
          curl -fL https://github.com/ibireme/yyjson/archive/refs/tags/0.11.1.tar.gz -o /tmp/yyjson-0.11.1.tar.gz
          echo '610a38a5e59192063f5f581ce0c3c1869971c458ea11b58dfe00d1c8269e255d  /tmp/yyjson-0.11.1.tar.gz' | sha256sum -c -
          mkdir -p /tmp/yjson-yyjson-second
          tar -xzf /tmp/yyjson-0.11.1.tar.gz -C /tmp/yjson-yyjson-second
      - name: Record toolchain
        run: |
          echo "resolved_cangjie_version=${{ needs.sts.outputs.version }} resolution=${{ needs.sts.outputs.resolution }}"
          echo "runner_image=${ImageOS:-unknown} runner_image_version=${ImageVersion:-unknown}"
          cjc -v
          cjpm --version
          python3 scripts/validate_cangjie_sts.py --check-installed \
            --record-installation "$RUNNER_TEMP/cangjie-installation.json"
          cat "$RUNNER_TEMP/cangjie-installation.json"
          python3 - <<'PY_STDX'
          import os
          import pathlib
          stdx = pathlib.Path(os.environ["CANGJIE_STDX_PATH_DYNAMIC"]) / "stdx"
          if not stdx.is_dir():
              raise SystemExit("installed stdx dynamic directory is missing")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("CANGJIE_STDX_PATH=" + stdx.as_posix() + "\n")
          PY_STDX
      - name: Run gate
        env:
          YJSON_RESOLVED_CANGJIE: ${{ needs.sts.outputs.version }}
          YJSON_SECOND_YYJSON_ROOT: ${{ matrix.gate == 'yyjson-colink' && '/tmp/yjson-yyjson-second/yyjson-0.11.1' || '' }}
          YJSON_STANDARDS_OFFLINE: ${{ contains(fromJSON('["standards-conformance","schema-formats-conformance"]'), matrix.gate) && '1' || '' }}
          YJSON_CI_DEPENDENCY_OVERRIDE: ${{ matrix.optimization }}
        run: |
          ulimit -s 131072
          ulimit -s
          echo "cangjie_optimization=$YJSON_CI_DEPENDENCY_OVERRIDE"
          scripts/ci_job.sh "${{ matrix.gate }}"

  pure-platforms:
    name: Pure (${{ matrix.os }})
    needs: sts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            optimization: '-O2'
          - os: macos-14
            optimization: '-O2'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          submodules: recursive
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571
        with:
          channel: sts
          version: ${{ needs.sts.outputs.version }}
          cjv-version: v0.5.0
          components: stdx
      - name: Record toolchain
        run: |
          echo "resolved_cangjie_version=${{ needs.sts.outputs.version }} resolution=${{ needs.sts.outputs.resolution }}"
          echo "runner_image=${ImageOS:-unknown} runner_image_version=${ImageVersion:-unknown}"
          cjc -v
          cjpm --version
          python3 scripts/validate_cangjie_sts.py --check-installed \
            --record-installation "$RUNNER_TEMP/cangjie-installation.json"
          cat "$RUNNER_TEMP/cangjie-installation.json"
          python3 - <<'PY_STDX'
          import os
          import pathlib
          stdx = pathlib.Path(os.environ["CANGJIE_STDX_PATH_DYNAMIC"]) / "stdx"
          if not stdx.is_dir():
              raise SystemExit("installed stdx dynamic directory is missing")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("CANGJIE_STDX_PATH=" + stdx.as_posix() + "\n")
          PY_STDX
      - name: Run Pure package gates
        env:
          YJSON_CI_DEPENDENCY_OVERRIDE: ${{ matrix.optimization }}
        run: |
          echo "cangjie_optimization=$YJSON_CI_DEPENDENCY_OVERRIDE"
          scripts/ci_job.sh pure-platform

  api-docs:
    name: API Documentation
    needs: sts
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          submodules: recursive
      - name: Install native example prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc libidn2-dev
          dpkg-query -W -f='${Package}=${Version}\n' clang gcc libidn2-dev
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571
        with:
          channel: sts
          version: ${{ needs.sts.outputs.version }}
          cjv-version: v0.5.0
          components: stdx
      - name: Record toolchain
        run: |
          echo "resolved_cangjie_version=${{ needs.sts.outputs.version }} resolution=${{ needs.sts.outputs.resolution }}"
          echo "runner_image=${ImageOS:-unknown} runner_image_version=${ImageVersion:-unknown}"
          cjc -v
          cjpm --version
          python3 scripts/validate_cangjie_sts.py --check-installed \
            --record-installation "$RUNNER_TEMP/cangjie-installation.json"
          cat "$RUNNER_TEMP/cangjie-installation.json"
          python3 - <<'PY_STDX'
          import os
          import pathlib
          stdx = pathlib.Path(os.environ["CANGJIE_STDX_PATH_DYNAMIC"]) / "stdx"
          if not stdx.is_dir():
              raise SystemExit("installed stdx dynamic directory is missing")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("CANGJIE_STDX_PATH=" + stdx.as_posix() + "\n")
          PY_STDX
      - name: Generate source-qualified cjdoc site
        env:
          YJSON_RESOLVED_CANGJIE: ${{ needs.sts.outputs.version }}
          YJSON_API_DOCS_OUTPUT: target/api-docs
        run: |
          ulimit -s 131072
          scripts/ci_job.sh api-docs
      - name: Upload downloadable API documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: yjson-api-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/api-docs
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload API documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: target/api-docs

  api-doc-examples-pure:
    name: API examples (${{ matrix.os }})
    needs: [sts, api-docs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          submodules: recursive
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571
        with:
          channel: sts
          version: ${{ needs.sts.outputs.version }}
          cjv-version: v0.5.0
          components: stdx
      - name: Record actual platform toolchain
        run: |
          echo "resolved_cangjie_version=${{ needs.sts.outputs.version }} resolution=${{ needs.sts.outputs.resolution }}"
          cjc -v
          cjpm --version
          python3 scripts/validate_cangjie_sts.py --check-installed \
            --record-installation "$RUNNER_TEMP/cangjie-installation.json"
          python3 - <<'PY_STDX'
          import os
          import pathlib
          stdx = pathlib.Path(os.environ["CANGJIE_STDX_PATH_DYNAMIC"]) / "stdx"
          if not stdx.is_dir():
              raise SystemExit("installed stdx dynamic directory is missing")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("CANGJIE_STDX_PATH=" + stdx.as_posix() + "\n")
          PY_STDX
      - name: Download the qualified Linux documentation and frozen sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: yjson-api-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/api-docs
      - name: Execute the same Doc IR examples on this platform
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          YJSON_CI_DEPENDENCY_OVERRIDE: '-O2'
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          python3 scripts/run_api_doc_examples.py target/api-docs
      - name: Upload platform execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: yjson-api-examples-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/api-docs/example-execution.json
            target/api-docs/example-mapping.json
          if-no-files-found: warn
          retention-days: 30

  pages:
    name: Deploy API Documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api-docs, ci-required]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages-main
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check deployment still targets main HEAD
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded documentation for $GITHUB_SHA; main=$latest"
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy GitHub Pages
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  coverage:
    name: Core Coverage
    needs: sts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 0
          submodules: recursive
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571
        with:
          channel: sts
          version: ${{ needs.sts.outputs.version }}
          cjv-version: v0.5.0
          components: stdx
      - name: Record toolchain
        run: |
          echo "resolved_cangjie_version=${{ needs.sts.outputs.version }} resolution=${{ needs.sts.outputs.resolution }}"
          echo "runner_image=${ImageOS:-unknown} runner_image_version=${ImageVersion:-unknown}"
          cjc -v
          cjpm --version
          python3 scripts/validate_cangjie_sts.py --check-installed \
            --record-installation "$RUNNER_TEMP/cangjie-installation.json"
          cat "$RUNNER_TEMP/cangjie-installation.json"
          python3 - <<'PY_STDX'
          import os
          import pathlib
          stdx = pathlib.Path(os.environ["CANGJIE_STDX_PATH_DYNAMIC"]) / "stdx"
          if not stdx.is_dir():
              raise SystemExit("installed stdx dynamic directory is missing")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("CANGJIE_STDX_PATH=" + stdx.as_posix() + "\n")
          PY_STDX
      - name: Generate cjcov and LCOV reports
        run: scripts/coverage.sh
      - name: Detect established coverage baseline
        if: github.event_name == 'pull_request'
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git show "$BASE_SHA:coverage-baseline.toml" >/dev/null 2>&1; then
            echo "enforce_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "enforce_patch=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap release: base branch has no coverage baseline; project gates remain blocking."
          fi
      - name: Verify patch line and branch coverage
        if: github.event_name == 'pull_request' && steps.baseline.outputs.enforce_patch == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --unified=0 "$BASE_SHA"...HEAD -- 'src/lib_*.cj' ':(exclude)src/lib_json_native_scanner.cj' > coverage/patch.diff
          python3 scripts/check_patch_coverage.py \
            --diff coverage/patch.diff \
            --lcov coverage/lcov.info \
            --baseline coverage-baseline.toml
      - name: Upload core coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          use_oidc: true
          files: coverage/lcov.info
          flags: core
          disable_search: true
          fail_ci_if_error: true
          verbose: true
      # Per-package flags mirror codecov.yml. The lcov files are produced when
      # the package coverage collector lands in scripts/coverage.sh; each
      # upload activates the corresponding project and patch gates in
      # codecov.yml. Until a file exists the step is skipped and the flag is
      # simply not reported.
      - name: Upload algorithms coverage to Codecov
        if: hashFiles('coverage/lcov.algorithms.info') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          use_oidc: true
          files: coverage/lcov.algorithms.info
          flags: algorithms
          disable_search: true
          fail_ci_if_error: true
          verbose: true
      - name: Upload native coverage to Codecov
        if: hashFiles('coverage/lcov.native.info') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          use_oidc: true
          files: coverage/lcov.native.info
          flags: native
          disable_search: true
          fail_ci_if_error: true
          verbose: true
      - name: Upload yyjson coverage to Codecov
        if: hashFiles('coverage/lcov.yyjson.info') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          use_oidc: true
          files: coverage/lcov.yyjson.info
          flags: yyjson
          disable_search: true
          fail_ci_if_error: true
          verbose: true
      - name: Upload schema-formats coverage to Codecov
        if: hashFiles('coverage/lcov.schema-formats.info') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          use_oidc: true
          files: coverage/lcov.schema-formats.info
          flags: schema-formats
          disable_search: true
          fail_ci_if_error: true
          verbose: true


  ci-required:
    name: CI Required
    if: ${{ always() }}
    needs:
      - ci-guardrails
      - generated-change-risk
      - perf-evidence-drift
      - stream-docs
      - sts
      - tests
      - pure-platforms
      - api-docs
      - api-doc-examples-pure
      - coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every quality gate to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          expected = {
              "ci-guardrails", "generated-change-risk", "perf-evidence-drift",
              "stream-docs", "sts", "tests", "pure-platforms", "api-docs", "api-doc-examples-pure", "coverage",
          }
          results = json.loads(os.environ["NEEDS_JSON"])
          if not isinstance(results, dict) or set(results) != expected:
              raise SystemExit("CI dependency inventory is missing or unexpected")
          failed = {
              name: value.get("result") if isinstance(value, dict) else None
              for name, value in results.items()
              if not isinstance(value, dict) or value.get("result") != "success"
          }
          if failed:
              raise SystemExit("CI quality gates did not succeed: " + json.dumps(failed, sort_keys=True))
          print("All required CI quality gates succeeded")
          PY
