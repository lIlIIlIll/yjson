[package]
  cjc-version = "1.2.0"
  name = "yjson_native_accel"
  organization = ""
  description = "Single-option startup acceleration for yjson"
  version = "0.2.0"
  output-type = "static"
  compile-option = "-O2"
  link-option = "-L target/native -lyjson_scanner"

[dependencies]
  yjson_native_primitives = { path = "../yjson_native_primitives" }

[test-dependencies]
  yjson = { path = "../.." }
  yjson_macros = { git = "https://github.com/lIlIIlIll/yjson_macros.git", commitId = "d819745310f8cc6aa416e1298f706ea5138b7d16" }
