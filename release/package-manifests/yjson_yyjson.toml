description = "Optional yyjson-backed native DOM facade for yjson"
version = "0.1.1"
script-dir = ""
output-type = "dynamic"
compile-option = "-O2"
link-option = "-L target/native -lyjson_yyjson -lyjson_scanner"

[dependencies]
